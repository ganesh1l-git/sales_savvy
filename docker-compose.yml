
services:
  mysql:
    image: mysql:8.0
    container_name: sales_savvy_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sales_savvy}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_savvy_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_savvy_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sales_savvy}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_1DP5mmOlF5G5ag}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_dummy_replace_with_yours}
      SHIPPING_RATE_STANDARD: ${SHIPPING_RATE_STANDARD:-50.00}
      SHIPPING_RATE_EXPRESS: ${SHIPPING_RATE_EXPRESS:-120.00}
    networks:
      - sales_savvy_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_savvy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - sales_savvy_net

volumes:
  mysql_data:
    driver: local

networks:
  sales_savvy_net:
    driver: bridge
